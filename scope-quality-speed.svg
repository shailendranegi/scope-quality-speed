<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Scope, Quality, and Speed</title>
  <desc id="desc">A conceptual triangle connecting Scope, Quality, and Speed, centered on effective engineering capacity and capability. It is not a mathematical theorem.</desc>
  <rect width="900" height="560" rx="20" fill="#f8fafc"/>
  <polygon points="450,93 182,447 718,447" fill="#e2e8f0" fill-opacity="0.55" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#0f172a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="450" y="63" font-size="30" font-weight="700" letter-spacing="2">SCOPE</text>
    <text x="182" y="490" font-size="30" font-weight="700" letter-spacing="2">QUALITY</text>
    <text x="718" y="490" font-size="30" font-weight="700" letter-spacing="2">SPEED</text>
    <text x="450" y="265" font-size="23" font-weight="700">Effective delivery</text>
    <text x="450" y="301" font-size="23" font-weight="700">capacity and capability</text>
    <text x="450" y="353" font-size="19" fill="#475569">Constraints shape trade-offs</text>
  </g>
  <g fill="#0f172a">
    <circle cx="450" cy="93" r="9"/>
    <circle cx="182" cy="447" r="9"/>
    <circle cx="718" cy="447" r="9"/>
  </g>
</svg>
